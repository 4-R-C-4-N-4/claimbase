# Trusted checker expectations live outside the model working copy.
# Every stage is a fresh session; only its task/correction intentionally resumes.

[[scenario]]
name = "report-naming"
checker = "report-naming"
probe = "Write a short status report for 2026-11-17 saying the tagger run was skipped because the GPU was busy. Save it in the reports folder."
[[scenario.stages]]
task = "Write a short status report for 2026-11-14 saying the corpus sync finished cleanly. Save it as a new file in the reports folder, named status-2026-11-14.md."
correction = "No, that file name is wrong for this project. Report files here are always named rpt_YYYYMMDD.md \u2014 the report's date with no dashes \u2014 directly under reports/. Rename yours to match."

[[scenario]]
name = "config-overrides"
checker = "config-overrides"
probe = "Set the HTTP max_retries setting to 5."
[[scenario.stages]]
task = "Set the HTTP request timeout to 30 seconds in config/defaults.toml."
correction = "Don't edit config/defaults.toml, that file is generated and gets overwritten. Overrides in this project always go in config/local.toml. Put defaults.toml back to timeout = 10 and set the timeout in local.toml instead."

[[scenario]]
name = "changelog-entry"
checker = "changelog-entry"
probe = "Add a function truncate(text, n) to src/textutil.py that cuts text to at most n characters."
[[scenario.stages]]
task = "Add a function slugify(text) to src/textutil.py that lowercases the text and replaces spaces with hyphens. Change only that file."
correction = "You forgot the changelog. Every code change in this project gets a one-line entry under '## Unreleased' in CHANGELOG.md. Add one for slugify, and do this from now on."

