[project]
name = "claimbase"
version = "0.0.0"
description = "A compiled personal knowledge substrate — append-only capture, claim graph, bitemporal recall"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2", "mcp>=1.0"]

[project.optional-dependencies]
# Added per milestone rather than up front; see PLAN.md.
store = ["psycopg[binary]>=3.2"]
eval = ["numpy>=1.26"]

[project.scripts]
claimbase = "claimbase.cli:main"
claimbase-mcp = "claimbase.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimbase"]
